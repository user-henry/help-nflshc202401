<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天气泡 - 官方组件测试</title>
    <style>
        /* ===== 页面基础样式 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            color: #eef4ff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 600px;
            padding: 40px 20px;
            text-align: center;
        }
        .container h1 {
            font-size: 32px;
            color: #ffd700;
            margin-bottom: 12px;
        }
        .container p {
            color: #aaa;
            font-size: 16px;
            line-height: 1.8;
        }
        .container .test-card {
            background: #16213e;
            border-radius: 12px;
            padding: 24px;
            margin-top: 24px;
            border: 1px solid #2a2a3e;
        }
        .container .test-card .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }
        .status {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            margin-top: 12px;
        }
        .status.loading {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
        }
        .status.ready {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
        }
        .status.error {
            background: rgba(220, 53, 69, 0.15);
            color: #dc3545;
        }
        .shortcut-hint {
            margin-top: 20px;
            font-size: 13px;
            color: #555;
        }
        .shortcut-hint kbd {
            background: #0f0f1a;
            border: 1px solid #2a2a3e;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            font-family: inherit;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧪 AI 聊天气泡测试</h1>
        <p>基于 Cloudflare 官方 Web Component</p>
        <div class="test-card">
            <span class="icon">🤖</span>
            <p style="color: #ffd700; font-weight: bold;">Cloudflare AI Search</p>
            <p style="font-size: 13px; color: #666;">右下角将显示聊天气泡，点击即可对话</p>
            <div id="statusDisplay" class="status loading">⏳ 组件加载中...</div>
        </div>
        <div class="shortcut-hint">
            <kbd>Ctrl</kbd> + <kbd>K</kbd> 或 <kbd>⌘</kbd> + <kbd>K</kbd> 快速打开 · <kbd>ESC</kbd> 关闭
        </div>
    </div>

    <!-- ============================================================ -->
    <!--  1. 引入官方组件库                                            -->
    <!-- ============================================================ -->
    <script
        type="module"
        src="https://2c177107-5a66-4ac2-bf55-04f0bcad8fef.search.ai.cloudflare.com/assets/v0.0.40/search-snippet.es.js"
    ></script>

    <!-- ============================================================ -->
    <!--  2. 聊天气泡组件（必须设置 api-url）                          -->
    <!-- ============================================================ -->
    <chat-bubble-snippet
        api-url="https://2c177107-5a66-4ac2-bf55-04f0bcad8fef.search.ai.cloudflare.com/"
        placeholder="输入问题，AI 帮你解答..."
        theme="dark"
    ></chat-bubble-snippet>

    <!-- ============================================================ -->
    <!--  3. 状态检测脚本                                              -->
    <!-- ============================================================ -->
    <script>
        (function() {
            const statusDisplay = document.getElementById('statusDisplay');

            function updateStatus(text, type) {
                if (!statusDisplay) return;
                statusDisplay.textContent = text;
                statusDisplay.className = 'status ' + (type || 'loading');
            }

            // 检测组件是否加载成功
            function checkComponents() {
                const hasChatBubble = !!document.querySelector('chat-bubble-snippet');
                if (hasChatBubble) {
                    updateStatus('✅ 组件加载成功！点击右下角气泡测试', 'ready');
                    console.log('✅ Chat Bubble 组件加载成功');
                } else {
                    updateStatus('⚠️ 组件未加载，请检查网络', 'error');
                    console.warn('⚠️ Chat Bubble 组件未找到');
                }
            }

            // 监听组件 ready 事件
            document.addEventListener('ready', function(e) {
                console.log('✅ 组件已就绪:', e.target.tagName);
                updateStatus('✅ 组件已就绪，可以正常使用', 'ready');
            });

            // 等待 DOM 渲染完成
            if (document.readyState === 'complete') {
                setTimeout(checkComponents, 1500);
            } else {
                window.addEventListener('load', function() {
                    setTimeout(checkComponents, 1500);
                });
            }

            console.log('🤖 AI 聊天气泡测试页面已加载');
            console.log('🔗 API 端点: https://2c177107-5a66-4ac2-bf55-04f0bcad8fef.search.ai.cloudflare.com/');
            console.log('💬 右下角金色气泡可进行 AI 对话');
        })();
    </script>

</body>
</html>
